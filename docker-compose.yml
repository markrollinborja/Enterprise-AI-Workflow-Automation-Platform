services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
      POSTGRES_DB: meridian_flow
    # Host port 5433, not 5432 — deliberately avoiding the default Postgres
    # port on the host. Containers still talk to each other over the internal
    # Docker network on port 5432 (DATABASE_URL below uses "db:5432"), so this
    # only affects connections made *from Windows itself* — e.g. pytest run
    # from a local venv, or psql run directly from a host terminal. If your
    # machine has any other Postgres already listening on 5432 (a native
    # install, another project's container, etc.), this prevents the two from
    # colliding — whichever one grabbed 5432 first would otherwise silently
    # "win" for any localhost:5432 connection, causing password/auth errors
    # that have nothing to do with this project's actual database.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian_flow"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://meridian:meridian@db:5432/meridian_flow
      WORKFLOWS_DIR: /app/workflows
      MCP_SERVER_URL: http://mcp_server:8100/mcp
      # OIDC_ISSUER (from .env) must stay the browser-facing
      # localhost:8080 URL — it has to exactly match every token's iss
      # claim. But "localhost" from inside this container is this
      # container, not the host, so the backend can't fetch JWKS from
      # that address. This is the one OIDC setting that has to differ
      # between what the browser sees and what this container sees, same
      # reasoning as DATABASE_URL and MCP_SERVER_URL above — see
      # Settings.oidc_jwks_uri.
      OIDC_JWKS_URI: http://keycloak:8080/realms/meridian/protocol/openid-connect/certs
      # Same two-address problem as OIDC_JWKS_URI just above, same fix: the
      # backend fetches Keycloak's SAML IdP metadata itself, over the
      # compose network, where "localhost" resolves to this container, not
      # the host. See Settings.saml_idp_metadata_url.
      SAML_IDP_METADATA_URL: http://keycloak:8080/realms/meridian/protocol/saml/descriptor
    command: >
      sh -c "alembic upgrade head &&
             python -m app.db.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mcp_server:
        condition: service_started
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      # Not needed for the app to run — mounted so `docker compose run
      # backend pytest` etc. works for local dev without a separate Python
      # install. The Dockerfile deliberately excludes these from the actual
      # image (no reason to ship tests/dev-tooling config in a runtime
      # container), so they only exist here via this mount.
      - ./backend/tests:/app/tests
      - ./backend/pyproject.toml:/app/pyproject.toml
      - ./backend/requirements-dev.txt:/app/requirements-dev.txt
      # workflows/*.json lives at the repo root (ADR-0003 — checked in
      # outside backend/ so it reads like config, not application code).
      # Read-only: the backend loads these, never writes them.
      - ./workflows:/app/workflows:ro

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  worker:
    # Same image as backend — it's the same codebase calling the same
    # service-layer functions, just on a poll loop instead of behind a
    # route (see docs/architecture/background-jobs.md, ADR-0002). No
    # separate Dockerfile needed.
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://meridian:meridian@db:5432/meridian_flow
      MCP_SERVER_URL: http://mcp_server:8100/mcp
    # The sleep is a pragmatic wait for backend's migrations+seed to finish
    # (depends_on only waits for the container to *start*, not for that
    # command to complete) — not bulletproof against a slow first boot,
    # acceptable for local demo scale. A production version would use a
    # real readiness check instead of a fixed delay.
    command: sh -c "sleep 5 && python -m app.workers.runner"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
      mcp_server:
        condition: service_started
    volumes:
      - ./backend/app:/app/app

  mcp_server:
    # Its own real process (ADR-0005) — a separate Dockerfile/codebase from
    # backend, not a module backend imports. The backend and worker connect
    # to this over the network as MCP clients (see
    # backend/app/services/integrations/mcp_client.py). See ADR-0012 for
    # why MCP_MOCK_MODE defaults true: a demo must never depend on live
    # Jira/Slack/Google credentials being valid right now.
    build:
      context: ./mcp_server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # lookup_employee (Phase 10 checkpoint 2) reads Employee/Department
      # rows directly — its own minimal, read-only query, not a shared
      # import of backend's SQLAlchemy models (two genuinely independent
      # services, sharing only the DB schema).
      DATABASE_URL: postgresql://meridian:meridian@db:5432/meridian_flow
    ports:
      - "8100:8100"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./mcp_server/app:/app/app

  # --------------------------------------------------------------------
  # V2 opt-in services. Everything above is the V1 base stack and starts
  # with a bare `docker compose up`; everything below requires an explicit
  # --profile. That split is deliberate: someone who just cloned this repo
  # should be able to run the core platform without booting an identity
  # provider, a workflow tool and an observability stack they did not ask
  # for. See docs/architecture/n8n.md.
  # --------------------------------------------------------------------

  n8n:
    # Pinned to a specific version rather than :latest — a workflow export in
    # this repo is only importable into a version that understands its node
    # schema, and `latest` silently breaking that on someone else's machine
    # is exactly the kind of failure a portfolio reviewer cannot debug.
    #
    # 1.121.0 is a floor, not a preference. n8n versions 1.65 through 1.120.4
    # carry a published security advisory: improper input validation in
    # workflows combining a Form Submission trigger with a Form Ending node
    # returning a binary file, allowing an unauthenticated remote attacker
    # read access to the underlying file system. This project's workflows use
    # no Form nodes and are therefore not exploitable through that path, but
    # pinning a known-vulnerable version is not something to leave in a repo
    # someone else will run. The original pin here was 1.76.1, caught by
    # n8n's own in-app update banner during Phase 2 verification.
    # Advisory: https://blog.n8n.io/security-advisory-20260108/
    #
    # Safe to bump within 1.x. Moving to 2.x is a deliberate migration, not a
    # patch — node schemas change and the workflow exports would need
    # re-verification.
    image: n8nio/n8n:1.121.0
    profiles: ["integrations"]
    restart: unless-stopped
    environment:
      # No N8N_BASIC_AUTH_* here, deliberately. n8n removed basic auth in
      # v1.0 and made user management mandatory; those variables are
      # silently ignored on 1.x, which is worse than absent — they read
      # like a security control that does not exist. On first visit n8n
      # prompts to create an instance owner account, stored in the n8n_data
      # volume. See docs/architecture/n8n.md.
      #
      # Meridian's ingestion endpoint, reachable on the compose network.
      # The workflows read this rather than hardcoding a URL, so the same
      # export works against a different backend host.
      MERIDIAN_API_URL: http://backend:8000
      # n8n signs its calls to /inbound/events with this. Same value the
      # backend verifies against (N8N_WEBHOOK_SECRET in .env) — if they
      # diverge, every delivery gets a 401 and the failure is immediate and
      # obvious rather than subtle.
      MERIDIAN_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
      GENERIC_TIMEZONE: America/Chicago
      # Suppresses n8n's permissions warning about the mounted config file
      # on Windows bind mounts, which is noise rather than a real problem
      # here.
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "false"
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      # Workflow exports are version-controlled (see integrations/n8n/) and
      # mounted read-only so an accidental edit inside the container cannot
      # rewrite the file the repository considers authoritative. Import is
      # a documented manual step, not an automatic overwrite.
      - ./integrations/n8n/workflows:/workflows:ro
    depends_on:
      backend:
        condition: service_started

  keycloak:
    # Pinned, and checked against published advisories before bumping —
    # the n8n pin in this file was originally chosen without that check and
    # landed inside a vulnerable range (see its comment). An identity
    # provider is the worst place to repeat that mistake.
    image: quay.io/keycloak/keycloak:26.0
    profiles: ["identity"]
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      # Bootstrap admin for the Keycloak console itself. Local development
      # only — `start-dev` is explicitly not a production mode, it disables
      # HTTPS enforcement and uses an in-memory H2 database.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      # The issuer in every token must match what the backend validates
      # against, exactly — including scheme, host and port. Keycloak derives
      # it from the request host unless told otherwise, which means a token
      # obtained through localhost:8080 and one obtained through
      # keycloak:8080 carry *different* issuers and only one of them passes
      # validation. Setting it explicitly removes that class of bug.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_STRICT: "false"
    volumes:
      # Realm config is version-controlled and imported at startup, so the
      # identity setup is reproducible rather than a sequence of console
      # clicks nobody wrote down. Read-only: an edit made in the admin
      # console is deliberately not written back here — the file stays the
      # source of truth, and console changes are understood to be temporary.
      - ./infra/keycloak/realm-meridian.json:/opt/keycloak/data/import/realm-meridian.json:ro
    ports:
      - "8080:8080"

  prometheus:
    # V2 Module 7 part 1 (ADR-0022). Scrapes backend, worker and mcp_server's
    # /metrics endpoints on the compose network -- see
    # infra/observability/prometheus.yml for the three targets.
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    restart: unless-stopped
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend
      - worker
      - mcp_server

  grafana:
    # Dashboards and the Prometheus datasource are provisioned as code (see
    # infra/observability/grafana/provisioning/) rather than built by hand
    # in the UI -- someone running `docker compose --profile observability
    # up` should land on a working dashboard, not an empty Grafana asking
    # to be configured.
    image: grafana/grafana:11.3.1
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      # Local demo credentials only -- same category as Keycloak's bootstrap
      # admin above. Never used for anything internet-reachable.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Skips Grafana's first-login "change your password" interstitial so
      # a demo screen-share goes straight to the dashboard.
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      # One mount, not two. The dashboard JSON lives inside
      # provisioning/dashboards/json/ on the host (see dashboards.yml's
      # `path`) rather than as a second bind mount nested inside this one
      # -- Docker Desktop on Windows/WSL2 can't create a mountpoint for a
      # second bind mount *inside* a directory this first mount already
      # made read-only ("read-only file system" at container create,
      # found the hard way running this for real). A single mount avoids
      # the nesting entirely.
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  n8n_data:
  prometheus_data:
  grafana_data:
