services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
      POSTGRES_DB: meridian_flow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian_flow"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://meridian:meridian@db:5432/meridian_flow
    command: >
      sh -c "alembic upgrade head &&
             python -m app.db.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      # Not needed for the app to run — mounted so `docker compose run
      # backend pytest` etc. works for local dev without a separate Python
      # install. The Dockerfile deliberately excludes these from the actual
      # image (no reason to ship tests/dev-tooling config in a runtime
      # container), so they only exist here via this mount.
      - ./backend/tests:/app/tests
      - ./backend/pyproject.toml:/app/pyproject.toml
      - ./backend/requirements-dev.txt:/app/requirements-dev.txt

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:

# worker (Phase 6) and mcp_server (Phase 10) services are added here once
# their code exists — see docs/architecture/system-architecture.md for the
# full intended 5-service topology. Keeping compose scoped to what actually
# runs today is deliberate: `docker compose up` should never point at a
# Dockerfile that doesn't exist yet.
