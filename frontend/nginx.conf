server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback. This app has exactly one server-rendered path
    # (/auth/callback, the OIDC redirect target) and otherwise handles all
    # routing client-side (see App.tsx's comment on why: state-based view
    # switching, not react-router). Without this, nginx's default behavior
    # 404s any path that isn't a literal file on disk — which is exactly
    # what happened to /auth/callback before this existed: Keycloak's
    # redirect landed on a real HTTP 404 page instead of the app, because
    # nginx had never been told that unknown paths are the SPA's job to
    # handle, not its own.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
